name: astrbot_plugin_sytori_memory
display_name: 做梦记忆
short_desc: 四层长期记忆 + 离线做梦整理
desc: |
  为 AstrBot 提供 Anthropic「The components of agent memory」风格的长期记忆：
  原始记录 → 精选笔记 → 互相关联的 Wiki → 每次会话加载的短索引；
  并在空闲时通过「做梦」纠正、合并、修剪、晋升记忆。
  灵感来源：https://www.anthropic.com/research/components-of-agent-memory
author: sytori
version: 0.1.2
repo: https://github.com/sytorinft/astrbot_plugin_sytori_memory
astrbot_version: ">=4.16.0"
keywords:
  - memory
  - dreaming
  - wiki
  - long-term
